<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Talent Factory - Career Intelligence for Immigrants in Finland</title>
  <meta name="description"
    content="Navigate your career in Finland with confidence. Talent Factory is the ultimate guide for immigrants, featuring a professional CV builder, AI career assistant, and a community for sharing work life experiences in Finland." />
  <meta name="keywords"
    content="Finland, working life, career, immigrants, CV builder, employment, integration, Voon IQ, Talent Factory, jobs in Finland, expat life Finland, Finnish work culture" />
  <meta name="author" content="Voon IQ" />

  <!-- AI & Search Engine Optimization -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />
  <link rel="canonical" href="https://worklife.voon.fi" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://worklife.voon.fi" />
  <meta property="og:title" content="Talent Factory - Career Intelligence for Immigrants in Finland" />
  <meta property="og:description"
    content="Build your Finnish CV, get AI career advice, and connect with the immigrant community. Your complete guide to succeding in Finland's job market." />
  <meta property="og:image" content="https://worklife.voon.fi/og-image.jpg" />
  <meta property="og:site_name" content="Talent Factory Finland" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Talent Factory - Career Intelligence for Immigrants" />
  <meta name="twitter:description"
    content="Navigate your career in Finland with confidence. CV builder, guides, and community support." />
  <meta name="twitter:image" content="https://worklife.voon.fi/og-image.jpg" />

  <!-- Structured Data (JSON-LD) for Search Engines & AI -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Talent Factory Finland",
      "url": "https://worklife.voon.fi",
      "description": "Comprehensive career guide and tools for immigrants in Finland.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://worklife.voon.fi/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Voon IQ",
      "url": "https://voon.fi",
      "logo": "https://worklife.voon.fi/vite.svg",
      "sameAs": [
        "https://www.linkedin.com/company/vooniq"
      ]
    }
    </script>

  <!-- Theme Color -->
  <meta name="theme-color" content="#0066CC" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
